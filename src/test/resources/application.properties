# ======================
# H2 TEST DATABASE
# ======================
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# ======================
# JPA / HIBERNATE
# ======================
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# ======================
# H2 CONSOLE (optional)
# ======================
spring.h2.console.enabled=true

# ======================
# MAIL (stub to avoid crash)
# ======================
spring.mail.host=localhost
spring.mail.port=25

# ======================
# WSEP — DISABLED IN TESTS
# ======================
# Production defaults to wsep.enabled=true (real HTTP to koyeb). Tests force
# it off so CI uses the in-memory stubs (PaymentGatewayProxy /
# TicketSupplierGatewayProxy) and never hits the network — fast and
# deterministic. The WSEP HTTP adapter itself is covered separately by
# WsepClientTest / WsepPaymentGatewayTest / WsepTicketSupplierGatewayTest
# using MockRestServiceServer.
wsep.enabled=false
